<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body,#map{margin:0;padding:0;width:100%;height:100%;background:#111}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:8px!important;background:rgba(0,0,0,0.4)!important;color:#aaa!important}
.leaflet-control-attribution a{color:#888!important}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const p      = new URLSearchParams(location.search);
const lat    = parseFloat(p.get('lat')  || '46.81228');
const lon    = parseFloat(p.get('lon')  || '-71.21454');
const zoom   = parseInt(p.get('zoom')   || '11');
const apiKey = p.get('apiKey')          || '';

const map = L.map('map', { zoomControl:false, attributionControl:true })
             .setView([lat, lon], zoom);

// 1. Esri World_Imagery — high-resolution satellite/aerial photography. No
//    API key required.
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution:'© Esri, Maxar, Earthstar Geographics', maxZoom:19 }
).addTo(map);

// 2. Esri reference overlay — transparent layer with road geometry, highways,
//    and place names. Sits between the satellite base and the traffic flow so
//    we can read street names and town labels without losing the imagery.
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:19, opacity:0.9 }
).addTo(map);
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:19, opacity:0.7 }
).addTo(map);

// 3. TomTom real-time traffic flow (green/yellow/red speed vs free-flow)
if (apiKey) {
  L.tileLayer(
    'https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=' + apiKey + '&tileSize=256',
    { maxZoom:18, opacity:0.8, attribution:'© TomTom' }
  ).addTo(map);
}

map.on('zoomend', function() {
  try { window.parent.postMessage({ type:'trafficZoom', zoom: map.getZoom() }, '*'); } catch(e) {}
});
</script>
</body>
</html>
